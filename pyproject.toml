[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delphipulse"
version = "1.0.0"
description = "Autonomous Evidence Miner & Hanson LMSR Information-Gain Engine for Gensyn Delphi"
authors = [{ name = "DelphiPulse Contributors" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
delphipulse = "delphipulse.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
